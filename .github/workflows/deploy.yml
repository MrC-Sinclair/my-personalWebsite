# ============================================================
# GitHub Actions 工作流：构建静态产物（发布到腾讯云 CVM）
# ============================================================
# 触发时机：当推送到 main 分支时自动执行
# 执行流程：质量门禁（lint / test / spellcheck）+ 真实浏览器审计 → 生成产物 → 上传 artifact
#
# 为什么构建留在这里而不在服务器或本机：
#   - 服务器是 2C2G，跑 `nuxt generate`（802 页预渲染）会 OOM；
#   - 本机 Windows 跑 generate 是「CPU 空转十几分钟零产物」，只有 Linux 上正常（约 48 秒）；
#   - 所以这里产出的 artifact 是唯一可信的发布物，下载后由
#     `node scripts/publish-cvm.mjs <解压目录>` 上传到 CVM。
# ============================================================

name: Build site for Tencent CVM

# ==================== 触发条件 ====================
# 定义何时运行此工作流
on:
  push:
    branches: [main] # 当代码推送到 main 分支时触发

# ==================== 权限配置 ====================
# 只读检出 + 写 artifact：不再需要 pages / id-token，
# 因为发布动作改成本机 `scripts/publish-cvm.mjs` 用 SSH 私钥推送到 CVM，
# 私钥只存在于本机 ~/.ssh/，不进 CI 密钥库。
permissions:
  contents: read # 读取仓库内容的权限（用于 checkout）

# ==================== 并发控制 ====================
# ⚠️ 组名**不能**叫 pages：GitHub 自带的 "pages build and deployment" workflow
#    也用 `pages` 这个组，两者会互斥——本项目已观察到推送后同时触发两套
#    workflow，内置的（Jekyll）必然失败，而我们的 run 被取消或长时间排队。
# cancel-in-progress: true —— 连续推送时只跑最新一个，不让队列积压
#    （802 页 × 2 语言预渲染一次要 5~10 分钟，积压 5 个就是近一小时）
concurrency:
  group: build-cvm-nuxt
  cancel-in-progress: true

# ==================== 任务定义 ====================
# 三个任务：quality（质量门禁）、audit（真实浏览器审计）、build（生成产物 + 传 artifact）。
# 三者并行，构建失败或检查红掉时不该下载产物——发布动作在人这一侧，
# 所以「先看这个 run 全绿，再跑 publish-cvm.mjs」是必须遵守的顺序。
jobs:
  # -------------------- 质量门禁任务 --------------------
  # 2026-10-07 补：此前 CI 只做 build + deploy，lint / test / spellcheck 全靠
  # 本地自觉，坏代码会一路推上线。这里把三道检查固化成独立 job：
  #   - 与 build 并行，不拖长总时长（构建本身要 5~10 分钟）
  #   - deploy 的 needs 包含 quality，任一检查红掉就不会发布
  # 注意：Install 会触发 postinstall（nuxi prepare），ESLint 与 Vitest 都依赖
  # .nuxt/tsconfig.json，跳过 install 会让两者报找不到模块。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 三道检查加起来约 2~3 分钟，15 分钟足够兜住卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本要求同 build（Node ≥ 22.13，pnpm 11.25.0），两处必须一致
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 与 build 共用同一 cache key，同一 run 内第二个 job 直接命中
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Spellcheck
        run: pnpm spellcheck

  # -------------------- 真实浏览器回归（移动端 + 无障碍）--------------------
  # 为什么需要它：样式跨风格泄漏这类 bug，lint / 单测 / 构建**全都抓不到**
  #   —— 真实例子：flat-design 的非 scoped layout.css 曾把 neo-brutalism 的
  #      色带从 321px 撑到 417px，还随样式注入顺序时有时无。
  # 这里跑 scripts/audit-a11y-mobile.mjs：移动端视口下量横向溢出、h1 数量、
  # 触控目标尺寸、图片 alt——全是确定性数值断言，不需要基线图、没有像素
  # diff 的跨平台抖动（字体渲染差异会让像素 diff 在 CI 上全红）。
  #
  # 抽样而非全量：全量 100 页约 8 分钟且每个页面都要 dev 首次编译，
  # CI 上划不来；抽样 6 个布局差异最大的风格（表格 / 极简 / 定宽像素 /
  # 网格 / 玻璃 / 黏土），全量留给本地改版后跑。
  #
  # 暂不放进 deploy 的 needs：先在真实 CI 里观察是否 flaky，稳定后再考虑卡发布。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 移动端 + 无障碍审计
        env:
          AUDIT_STYLES: dashboard,terminal,pixel,swiss,y2k,claymorphism
        run: |
          pnpm dev &
          # 等 dev server 就绪（首次编译需要一点时间）
          for i in $(seq 1 90); do
            curl -sf "http://localhost:3000/my-personalWebsite/" > /dev/null && break
            sleep 2
          done
          chrome --headless=new --no-sandbox --disable-component-update --no-first-run --remote-debugging-port=9222 &
          sleep 3
          node scripts/audit-a11y-mobile.mjs http://localhost:3000/my-personalWebsite

  # -------------------- 构建任务 --------------------
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新版本作为运行环境
    timeout-minutes: 60 # 预渲染 101 路由 × 2 语言，挂死时尽快失败而不是占满 6 小时配额

    steps:
      # 步骤 1：检出代码
      # 从仓库拉取源代码到 CI 服务器的文件系统
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js 运行时
      # 必须 ≥ 22.13：package.json 的 packageManager 锁定 pnpm@11.25.0，
      # 其 engines 为 node >=22.13。旧配置这里是 20，导致下一步 Setup pnpm 直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 步骤 3：安装 pnpm 包管理器
      # 版本与 package.json 的 packageManager（pnpm@11.25.0）保持一致。
      # 不用 pnpm/action-setup：它在本仓库会 0 秒失败（实测 Node 22 装好后仍失败），
      # 改用随 Node 自带的 npm 全局安装，链路更短、失败点更少。
      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      # 步骤 4：缓存 pnpm store
      # 顺序上 pnpm 在 setup-node 之后，不能再靠 setup-node 的 cache: pnpm，
      # 因此按 pnpm 官方做法显式缓存 store 目录
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤 5：安装项目依赖
      # 根据 package.json 和 pnpm-lock.yaml 安装所有依赖
      - name: Install dependencies
        run: pnpm install

      # 步骤 6：生成静态站点（发布用的唯一可信产物）
      # 这里显式给两个构建期变量，它们会烘进 HTML 里的每一条资源链接：
      #   NUXT_APP_BASE_URL=/            CVM 按根路径发布，不再是 GitHub Pages 的子路径
      #   NUXT_PUBLIC_SITE_URL           canonical / og:url / sitemap / feed 的绝对前缀
      # 想换成域名时在仓库 Settings → Secrets and variables → Actions 里加
      # SITE_URL / SITE_BASE_URL 两个 variable，不用改这份工作流。
      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: ${{ vars.SITE_BASE_URL || '/' }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://122.51.97.106:8444' }}
        run: pnpm generate

      # 步骤 7：上传为可下载的 artifact
      # 用标准 upload-artifact（不是 upload-pages-artifact，那个只服务 Pages）：
      # 在这个 run 的 Summary 页面底部下载 site-cvm.zip，解压后交给
      #   node scripts/publish-cvm.mjs <解压目录>
      # ⚠️ 下载前先确认本 run 的 quality / audit 两个 job 是绿的——
      # 它们与 build 并行跑，红掉时产物虽然已经上传，但不该发布。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-cvm
          path: .output/public # Nuxt SSG 的输出目录
          retention-days: 14
          if-no-files-found: error

      # 步骤 8：把下载地址写进 run 摘要，省得回去翻 URL
      - name: Write publish hint
        shell: bash
        run: |
          {
            echo "### 发布到 CVM"
            echo ""
            echo "下载本 run 的 \`site-cvm\` artifact，解压后执行："
            echo ""
            echo '```bash'
            echo "node scripts/publish-cvm.mjs <解压出来的目录>"
            echo '```'
            echo ""
            echo "产物页：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "发布前确认 quality / audit 两个 job 为绿。"
          } >> "$GITHUB_STEP_SUMMARY"
