# ============================================================
# GitHub Actions 工作流：自动部署到 GitHub Pages
# ============================================================
# 触发时机：当推送到 main 分支时自动执行
# 执行流程：质量门禁（lint / test / spellcheck）→ 构建 → 部署到 GitHub Pages
# ============================================================

name: Deploy to GitHub Pages

# ==================== 触发条件 ====================
# 定义何时运行此工作流
on:
  push:
    branches: [main] # 当代码推送到 main 分支时触发

# ==================== 权限配置 ====================
# GitHub Actions 需要的权限（用于部署到 GitHub Pages）
permissions:
  contents: read # 读取仓库内容的权限（用于 checkout）
  pages: write # 写入 GitHub Pages 的权限（用于部署）
  id-token: write # 用于 OIDC 身份验证（GitHub Pages 部署需要）

# ==================== 并发控制 ====================
# ⚠️ 组名**不能**叫 pages：GitHub 自带的 "pages build and deployment" workflow
#    也用 `pages` 这个组，两者会互斥——本项目已观察到推送后同时触发两套
#    workflow，内置的（Jekyll）必然失败，而我们的 run 被取消或长时间排队。
# cancel-in-progress: true —— 连续推送时只跑最新一个，不让队列积压
#    （802 页 × 2 语言预渲染一次要 5~10 分钟，积压 5 个就是近一小时）
concurrency:
  group: deploy-pages-nuxt
  cancel-in-progress: true

# ==================== 任务定义 ====================
# 工作流包含三个任务：quality（质量门禁）、build（构建）和 deploy（部署）
# quality 与 build 并行跑，deploy 需要两者都成功——坏代码不会推上线
jobs:
  # -------------------- 质量门禁任务 --------------------
  # 2026-10-07 补：此前 CI 只做 build + deploy，lint / test / spellcheck 全靠
  # 本地自觉，坏代码会一路推上线。这里把三道检查固化成独立 job：
  #   - 与 build 并行，不拖长总时长（构建本身要 5~10 分钟）
  #   - deploy 的 needs 包含 quality，任一检查红掉就不会发布
  # 注意：Install 会触发 postinstall（nuxi prepare），ESLint 与 Vitest 都依赖
  # .nuxt/tsconfig.json，跳过 install 会让两者报找不到模块。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 三道检查加起来约 2~3 分钟，15 分钟足够兜住卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本要求同 build（Node ≥ 22.13，pnpm 11.25.0），两处必须一致
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 与 build 共用同一 cache key，同一 run 内第二个 job 直接命中
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Spellcheck
        run: pnpm spellcheck

  # -------------------- 构建任务 --------------------
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新版本作为运行环境
    timeout-minutes: 60 # 预渲染 101 路由 × 2 语言，挂死时尽快失败而不是占满 6 小时配额

    steps:
      # 步骤 1：检出代码
      # 从仓库拉取源代码到 CI 服务器的文件系统
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js 运行时
      # 必须 ≥ 22.13：package.json 的 packageManager 锁定 pnpm@11.25.0，
      # 其 engines 为 node >=22.13。旧配置这里是 20，导致下一步 Setup pnpm 直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 步骤 3：安装 pnpm 包管理器
      # 版本与 package.json 的 packageManager（pnpm@11.25.0）保持一致。
      # 不用 pnpm/action-setup：它在本仓库会 0 秒失败（实测 Node 22 装好后仍失败），
      # 改用随 Node 自带的 npm 全局安装，链路更短、失败点更少。
      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      # 步骤 4：缓存 pnpm store
      # 顺序上 pnpm 在 setup-node 之后，不能再靠 setup-node 的 cache: pnpm，
      # 因此按 pnpm 官方做法显式缓存 store 目录
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤 5：配置 GitHub Pages
      # 自动设置 GitHub Pages 所需的配置
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 步骤 6：安装项目依赖
      # 根据 package.json 和 pnpm-lock.yaml 安装所有依赖
      - name: Install dependencies
        run: pnpm install

      # 步骤 7：生成静态站点
      # 执行 Nuxt 的静态生成命令，输出到 .output/public 目录
      - name: Generate static site
        run: pnpm generate

      # 步骤 8：上传构建产物
      # 将生成的静态文件打包为 artifact，供部署任务使用
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public # Nuxt SSG 的输出目录

  # -------------------- 部署任务 --------------------
  deploy:
    # 部署环境配置
    environment:
      name: github-pages # GitHub Pages 环境名称
      url: ${{ steps.deployment.outputs.page_url }} # 部署完成后显示的 URL

    runs-on: ubuntu-latest
    needs: [build, quality] # 构建与质量门禁都通过才部署

    steps:
      # 步骤 1：部署到 GitHub Pages
      # 将构建产物发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment # 设置步骤 ID，用于获取输出（如部署 URL）
        uses: actions/deploy-pages@v4
