# ============================================================
# GitHub Actions 工作流：构建静态产物（发布到腾讯云 CVM）
# ============================================================
# 触发时机：当推送到 main 分支时自动执行
# 执行流程：质量门禁（lint / test / spellcheck）+ 真实浏览器审计 → 生成产物 → 上传 artifact
#
# 为什么构建留在这里而不在服务器或本机：
#   - 服务器是 2C2G，跑 `nuxt generate`（802 页预渲染）会 OOM；
#   - 本机 Windows 跑 generate 是「CPU 空转十几分钟零产物」，只有 Linux 上正常（约 48 秒）；
#   - 所以这里产出的 artifact 是唯一可信的发布物，下载后由
#     `node scripts/publish-cvm.mjs <解压目录>` 上传到 CVM。
# ============================================================

name: Build site for Tencent CVM

# ==================== 触发条件 ====================
# 定义何时运行此工作流
# workflow_dispatch：Release 那一步出问题时，可以在不推代码的前提下重跑一次
# （产物与检查都会重跑，用于快速验证修复是否生效）
on:
  push:
    branches: [main] # 当代码推送到 main 分支时触发
  workflow_dispatch:

# ==================== 权限配置 ====================
# 只读检出 + 写 artifact：不再需要 pages / id-token，
# 因为发布动作改成本机 `scripts/publish-cvm.mjs` 用 SSH 私钥推送到 CVM，
# 私钥只存在于本机 ~/.ssh/，不进 CI 密钥库。
permissions:
  contents: read # 读取仓库内容的权限（用于 checkout）

# ==================== 并发控制 ====================
# ⚠️ 组名**不能**叫 pages：GitHub 自带的 "pages build and deployment" workflow
#    也用 `pages` 这个组，两者会互斥——本项目已观察到推送后同时触发两套
#    workflow，内置的（Jekyll）必然失败，而我们的 run 被取消或长时间排队。
# cancel-in-progress: true —— 连续推送时只跑最新一个，不让队列积压
#    （802 页 × 2 语言预渲染一次要 5~10 分钟，积压 5 个就是近一小时）
concurrency:
  group: build-cvm-nuxt
  cancel-in-progress: true

# ==================== 任务定义 ====================
# 四个任务：quality（质量门禁）、build（生成产物 + 传 artifact）、
# audit（对发布物跑真实浏览器审计，needs: build，中英两个 matrix）、
# release（把产物发成免鉴权可下载的 cvm-latest 资产）。
# quality 与 build 并行；audit 必须等 build，因为它量的就是 build 的那份产物。
# 发布动作在人这一侧，所以「先看这个 run 全绿，再跑 publish-cvm.mjs」是必须遵守的顺序。
jobs:
  # -------------------- 质量门禁任务 --------------------
  # 2026-10-07 补：此前 CI 只做 build + deploy，lint / test / spellcheck 全靠
  # 本地自觉，坏代码会一路推上线。这里把三道检查固化成独立 job：
  #   - 与 build 并行，不拖长总时长（构建本身要 5~10 分钟）
  #   - deploy 的 needs 包含 quality，任一检查红掉就不会发布
  # 注意：Install 会触发 postinstall（nuxi prepare），ESLint 与 Vitest 都依赖
  # .nuxt/tsconfig.json，跳过 install 会让两者报找不到模块。
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 三道检查加起来约 2~3 分钟，15 分钟足够兜住卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本要求同 build（Node ≥ 22.13，pnpm 11.25.0），两处必须一致
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 与 build 共用同一 cache key，同一 run 内第二个 job 直接命中
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Spellcheck
        run: pnpm spellcheck

  # -------------------- 真实浏览器回归（移动端 + 无障碍）--------------------
  # 为什么需要它：样式跨风格泄漏这类 bug，lint / 单测 / 构建**全都抓不到**
  #   —— 真实例子：flat-design 的非 scoped layout.css 曾把 neo-brutalism 的
  #      色带从 321px 撑到 417px，还随样式注入顺序时有时无。
  #
  # ★ 量的是 build job 的**发布物本身**：下载 site-cvm artifact（.output/public），
  #   用 scripts/serve-static.mjs 复刻生产 Caddy 的行为起来量。
  #   此前这里起的是 `pnpm dev`，而 dev 的 HMR 会在 DOM 里留幽灵节点
  #   （空的重复 <a>、0×0 / 420×0 的链接），拿它量触控目标会出假阳性；
  #   而且 SSG 产物里根本没有服务端，「可达性」这件事只能在静态宿主上量才算数。
  #   静态服务器与 Caddy 对齐四条语义：目录无尾斜杠 → 308、目录 → index.html、
  #   未命中 → 404（不做 SPA 回落）、base 前缀严格挂载。契约见 tests/serve-static.test.ts。
  #
  # 判据（scripts/audit-a11y-mobile.mjs）：横向溢出、h1 唯一、图片 alt、
  # 主文档 HTTP 状态、子资源（样式表/脚本）4xx，以及 390×844 下**命中区** ≥ 40×40。
  # 子资源那条是量具自检：挂载点与构建期 baseURL 不一致时页面照样出 h1，
  # 但全局样式与 JS 全 404，量到的是半裸页面（实测凭空多出 4 条假报警）。
  # 所以下面把同一个 SITE_BASE 同时喂给静态服务器与审计脚本。
  # 命中区不是边框盒：覆盖式链接（::after 用 inset:0 铺满整行）、外扩命中区
  #（inset 为负）、inline 包住块级子元素塌成 0 宽这三类，直接量
  # getBoundingClientRect 会全判成不合格，模型统一在 scripts/hit-box.mjs。
  # 24px 地板 + 整体豁免 inline 是 WCAG 2.5.8 的最低线，本站的无障碍红线是 40px。
  #
  # 全量 20 风格 × 5 页，中英各跑一遍：标签墙那类缺陷只在英文侧暴露
  #（英文 chip 更宽、绕的行更多），只测中文会得出错误结论。
  #
  # 暂不放进 release 的 needs：release 发的是固定 tag cvm-latest，一旦审计被
  # headless Chrome 的抖动带红，publish-cvm.mjs --latest 会**静默拉到上一个 commit
  # 的产物**并部署上去 —— 比 CI 报红更危险。人工闸保留：发布前确认本 run 全绿。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      # 一个语言红不该把另一个语言也取消掉，两边都要看得见结果
      fail-fast: false
      matrix:
        locale: [zh, en]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 审计脚本零依赖（只用 Node 内置的 http/WebSocket/fetch），所以这个 job
      # 不装 pnpm 也不装项目依赖，省掉一整轮 install
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Download 发布物
        uses: actions/download-artifact@v4
        with:
          name: site-cvm
          path: dist

      # 产物必须是 build job 的那一份，空目录会让审计对着 404 全体报警
      - name: 确认产物非空
        shell: bash
        run: |
          test -f dist/index.html || { echo "artifact 根目录没有 index.html"; exit 1; }
          echo "条目数: $(find dist -type f | wc -l)"

      - name: 移动端 + 无障碍审计（${{ matrix.locale }}）
        shell: bash
        env:
          AUDIT_LOCALE: ${{ matrix.locale }}
          # 与 build 用同一个 baseURL 前缀，否则页面里的资源链接与路由全部落空
          SITE_BASE: ${{ vars.SITE_BASE_URL || '/' }}
        run: |
          PREFIX="${SITE_BASE%/}"
          node scripts/serve-static.mjs dist 4173 "${SITE_BASE}" &
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:4173${PREFIX}/" > /dev/null && break
            sleep 1
          done
          chrome --headless=new --no-sandbox --disable-component-update --no-first-run \
            --remote-debugging-port=9222 &
          sleep 3
          CDP_PORT=9222 node scripts/audit-a11y-mobile.mjs "http://127.0.0.1:4173${PREFIX}"

  # -------------------- 构建任务 --------------------
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新版本作为运行环境
    timeout-minutes: 60 # 预渲染 101 路由 × 2 语言，挂死时尽快失败而不是占满 6 小时配额

    steps:
      # 步骤 1：检出代码
      # 从仓库拉取源代码到 CI 服务器的文件系统
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js 运行时
      # 必须 ≥ 22.13：package.json 的 packageManager 锁定 pnpm@11.25.0，
      # 其 engines 为 node >=22.13。旧配置这里是 20，导致下一步 Setup pnpm 直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 步骤 3：安装 pnpm 包管理器
      # 版本与 package.json 的 packageManager（pnpm@11.25.0）保持一致。
      # 不用 pnpm/action-setup：它在本仓库会 0 秒失败（实测 Node 22 装好后仍失败），
      # 改用随 Node 自带的 npm 全局安装，链路更短、失败点更少。
      - name: Setup pnpm
        run: |
          npm i -g pnpm@11.25.0
          pnpm --version

      # 步骤 4：缓存 pnpm store
      # 顺序上 pnpm 在 setup-node 之后，不能再靠 setup-node 的 cache: pnpm，
      # 因此按 pnpm 官方做法显式缓存 store 目录
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤 5：安装项目依赖
      # 根据 package.json 和 pnpm-lock.yaml 安装所有依赖
      - name: Install dependencies
        run: pnpm install

      # 步骤 6：生成静态站点（发布用的唯一可信产物）
      # 这里显式给两个构建期变量，它们会烘进 HTML 里的每一条资源链接：
      #   NUXT_APP_BASE_URL=/            CVM 按根路径发布，不再是 GitHub Pages 的子路径
      #   NUXT_PUBLIC_SITE_URL           canonical / og:url / sitemap / feed 的绝对前缀
      # 想换成域名时在仓库 Settings → Secrets and variables → Actions 里加
      # SITE_URL / SITE_BASE_URL 两个 variable，不用改这份工作流。
      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: ${{ vars.SITE_BASE_URL || '/' }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://122.51.97.106:8444' }}
        run: pnpm generate

      # 步骤 7：上传为可下载的 artifact
      # 用标准 upload-artifact（不是 upload-pages-artifact，那个只服务 Pages）：
      # 在这个 run 的 Summary 页面底部下载 site-cvm.zip，解压后交给
      #   node scripts/publish-cvm.mjs <解压目录>
      # ⚠️ 下载前先确认本 run 的 quality 与 audit 是绿的——audit 排在 build 之后
      #（它要拿这份产物），所以「build 绿了」不等于「可以发了」。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-cvm
          path: .output/public # Nuxt SSG 的输出目录
          retention-days: 14
          if-no-files-found: error

      # 步骤 8：把下载地址写进 run 摘要，省得回去翻 URL
      - name: Write publish hint
        shell: bash
        run: |
          {
            echo "### 发布到 CVM"
            echo ""
            echo '```bash'
            echo "node scripts/publish-cvm.mjs --latest   # 自己取本 run 的产物并上传"
            echo "node scripts/publish-cvm.mjs <目录>      # 或用手头已解压的产物"
            echo '```'
            echo ""
            echo "产物有两个来源：本 run 的 \`site-cvm\` artifact（下载要登录），"
            echo "以及下面 release job 发布的免鉴权资产 \`cvm-latest\`（--latest 走这条）。"
            echo ""
            echo "发布前确认 quality / audit 两个 job 为绿。"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------- 发布成免鉴权可下载的 Release 资产 --------------------
  # 为什么需要它：Actions 的 artifact 即使仓库是公开的，下载接口仍然要求鉴权
  # （实测匿名请求返回 401 Requires authentication），而发布机（本机 Windows）
  # 上没有 GitHub API 凭据 —— 于是每次上线都要人打开浏览器点一次下载，
  # 这是整条链路上唯一的人工卡点。公开仓库的 Release 资产可以匿名下载，
  # 所以把它固定发到 cvm-latest 这个 tag 上，`publish-cvm.mjs --latest` 就能一路自动。
  #
  # 需要 contents: write（建仓级 Release），所以单独一个 job，不给 build 扩权限。
  # artifact 那一份继续保留：Release 出问题时还能手工下载兜底。
  release:
    runs-on: ubuntu-latest
    needs: [build, quality] # 检查红掉就不该让这份产物变成「可被拉取的最新版本」
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-cvm
          path: site

      # 打成 tar.gz：两端都免依赖（Windows 自带 bsdtar 也能解 tar.gz），
      # 比 zip 更适合「下载后直接解包覆盖」这条链路
      - name: Pack
        shell: bash
        run: |
          test -f site/index.html || { echo "产物根目录没有 index.html，拒绝发布空包"; exit 1; }
          tar -czf site-cvm.tar.gz -C site .
          echo "打包大小: $(du -h site-cvm.tar.gz | cut -f1)"

      - name: Publish to release cvm-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★ 本 job 没有 actions/checkout，工作目录里没有 .git，gh 靠 git 探测仓库
          # 会报 `failed to run git: fatal: not a git repository`（前两轮 release 的红
          # 就是这个，与 token 权限无关 —— 匿名探测确认建 Release 是 HTTP 201）。
          # GH_REPO 是 gh 官方的「不在 git 仓库里也用它」开关：显式给仓库，
          # 比为了这一行去 checkout 整个仓库划算。
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # ★ 必须显式 set +e：runner 是用 `bash -eo pipefail` 执行 run 块的，
          # 「不加 -e」并不成立。上一轮 gh 一失败整个 step 就被掐死，
          # 下面那句 ::error:: 根本没来得及执行（annotations 里只剩通用的 exit 1）。
          set +e
          gh --version >/dev/null 2>&1 || echo "::warning title=缺工具::runner 上没有 gh CLI"
          gh release delete cvm-latest --cleanup-tag --yes 2>/dev/null
          out=$(gh release create cvm-latest site-cvm.tar.gz \
            --target "$GITHUB_SHA" \
            --title "CVM 产物（最近一次构建）" \
            --notes "供 scripts/publish-cvm.mjs --latest 拉取。来自 run $GITHUB_RUN_ID。" 2>&1)
          code=$?
          # 工作流命令里 % 必须写成 %25，否则命令解析失败、annotation 静默丢失
          msg=$(printf '%s' "$out" | tr '\n\r' '  ' | cut -c1-500 | sed 's/%/%25/g')
          if [ "$code" -ne 0 ]; then
            echo "::error title=Release 发布失败（exit $code）::$msg"
            exit "$code"
          fi
          echo "Release 资产：$out"
          echo "下载地址：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/cvm-latest/site-cvm.tar.gz"
