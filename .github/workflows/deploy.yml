# ============================================================
# GitHub Actions 工作流：自动部署到 GitHub Pages
# ============================================================
# 触发时机：当推送到 main 分支时自动执行
# 执行流程：构建 → 生成静态文件 → 部署到 GitHub Pages
# ============================================================

name: Deploy to GitHub Pages

# ==================== 触发条件 ====================
# 定义何时运行此工作流
on:
  push:
    branches: [main] # 当代码推送到 main 分支时触发

# ==================== 权限配置 ====================
# GitHub Actions 需要的权限（用于部署到 GitHub Pages）
permissions:
  contents: read # 读取仓库内容的权限（用于 checkout）
  pages: write # 写入 GitHub Pages 的权限（用于部署）
  id-token: write # 用于 OIDC 身份验证（GitHub Pages 部署需要）

# ==================== 并发控制 ====================
# 防止同一工作流多次同时运行造成冲突
concurrency:
  group: pages # 同一组的工作流共享并发限制
  cancel-in-progress: false # 不取消正在运行的部署，等待完成后再执行新的

# ==================== 任务定义 ====================
# 工作流包含两个任务：build（构建）和 deploy（部署）
jobs:
  # -------------------- 构建任务 --------------------
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新版本作为运行环境
    timeout-minutes: 60 # 预渲染 101 路由 × 2 语言，挂死时尽快失败而不是占满 6 小时配额

    steps:
      # 步骤 1：检出代码
      # 从仓库拉取源代码到 CI 服务器的文件系统
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js 运行时
      # 必须 ≥ 22.13：package.json 的 packageManager 锁定 pnpm@11.25.0，
      # 其 engines 为 node >=22.13。旧配置这里是 20，导致下一步 Setup pnpm 直接失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 步骤 3：安装 pnpm 包管理器
      # 版本与 package.json 的 packageManager（pnpm@11.25.0）保持一致
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # 使用 pnpm v11

      # 步骤 4：缓存 pnpm store
      # 顺序上 pnpm 在 setup-node 之后，不能再靠 setup-node 的 cache: pnpm，
      # 因此按 pnpm 官方做法显式缓存 store 目录
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤 4：配置 GitHub Pages
      # 自动设置 GitHub Pages 所需的配置
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 步骤 5：安装项目依赖
      # 根据 package.json 和 pnpm-lock.yaml 安装所有依赖
      - name: Install dependencies
        run: pnpm install

      # 步骤 6：生成静态站点
      # 执行 Nuxt 的静态生成命令，输出到 .output/public 目录
      - name: Generate static site
        run: pnpm generate

      # 步骤 7：上传构建产物
      # 将生成的静态文件打包为 artifact，供部署任务使用
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public # Nuxt SSG 的输出目录

  # -------------------- 部署任务 --------------------
  deploy:
    # 部署环境配置
    environment:
      name: github-pages # GitHub Pages 环境名称
      url: ${{ steps.deployment.outputs.page_url }} # 部署完成后显示的 URL

    runs-on: ubuntu-latest
    needs: build # 依赖构建任务，必须等 build 完成后才能执行

    steps:
      # 步骤 1：部署到 GitHub Pages
      # 将构建产物发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment # 设置步骤 ID，用于获取输出（如部署 URL）
        uses: actions/deploy-pages@v4
